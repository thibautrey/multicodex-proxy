name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: docker build --build-arg APP_GIT_SHA="$GITHUB_SHA" --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" .
